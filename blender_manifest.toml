schema_version = "1.0.0"

# Example of manifest file for a Blender extension
# Change the values according to your extension
id = "optiflow2"
version = "1.0.1"
name = "OptiFlow"
tagline = "A workflow optimization add-on designed to automate/help on repetitive tasks across the 3D pipeline for optimizations—handling PBR texture acquisition, conversion, compression, standardization, batch imports/exports."
maintainer = "gchibeni"
# Supported types: "add-on", "theme"
type = "add-on"

# Optional link to documentation, support, source files, etc
# website = "https://extensions.blender.org/add-ons/my-example-package/"

# Optional list defined by Blender and server, see:
# https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
tags = ["Optimization", "Workflow"]

blender_version_min = "4.2.0"
# # Optional: Blender version that the extension does not support, earlier versions are supported.
# # This can be omitted and defined later on the extensions platform if an issue is found.
# blender_version_max = "5.1.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX: prefix)
# https://docs.blender.org/manual/en/dev/advanced/extensions/licenses.html
license = [
  "SPDX:GPL-3.0-or-later",
]
# Optional: required by some licenses.
# copyright = [
#   "2002-2024 Developer Name",
#   "1998 Company Name",
# ]

# Optional list of supported platforms. If omitted, the extension will be available in all operating systems.
# platforms = ["windows-x64", "macos-arm64", "linux-x64"]
# Other supported platforms: "windows-arm64", "macos-x64"

# Bundle 3rd party Python modules.
# https://docs.blender.org/manual/en/dev/advanced/extensions/python_wheels.html
wheels = [
  # Python 3.11 — Blender 4.2 through 5.0
  "./wheels/pillow-12.1.1-cp311-cp311-macosx_10_10_x86_64.whl",
  "./wheels/pillow-12.1.1-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.1.1-cp311-cp311-manylinux2014_aarch64.manylinux_2_17_aarch64.whl",
  "./wheels/pillow-12.1.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/pillow-12.1.1-cp311-cp311-win_amd64.whl",
  "./wheels/pillow-12.1.1-cp311-cp311-win_arm64.whl",
  # Python 3.13 — Blender 5.1+
  "./wheels/pillow-12.1.1-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/pillow-12.1.1-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.1.1-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl",
  "./wheels/pillow-12.1.1-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pillow-12.1.1-cp313-cp313-win_amd64.whl",
  "./wheels/pillow-12.1.1-cp313-cp313-win_arm64.whl",
  # mozjpeg-lossless-optimization — optional JPEG optimiser (stable ABI, cp36+)
  # Available for Windows x64, Linux x64, macOS x64 only.
  "./wheels/mozjpeg_lossless_optimization-0.2.0-cp36-abi3-win_amd64.whl",
  "./wheels/mozjpeg_lossless_optimization-0.2.0-cp36-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/mozjpeg_lossless_optimization-0.2.0-cp36-abi3-macosx_10_9_x86_64.whl",
]

