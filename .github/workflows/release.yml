name: Package & Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Download Pillow wheels
              run: |
                  mkdir -p wheels
                  # Python 3.11 — Blender 4.2 through 5.0
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.11 --platform win_amd64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.11 --platform win_arm64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.11 --platform manylinux2014_x86_64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.11 --platform manylinux2014_aarch64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.11 --platform macosx_11_0_arm64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.11 --platform macosx_10_13_x86_64
                  # Python 3.13 — Blender 5.1+
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.13 --platform win_amd64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.13 --platform win_arm64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.13 --platform manylinux_2_28_x86_64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.13 --platform manylinux_2_28_aarch64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.13 --platform macosx_11_0_arm64
                  pip download "Pillow==12.1.1" --dest ./wheels --only-binary=:all: --python-version=3.13 --platform macosx_10_13_x86_64

            - name: Download mozjpeg-lossless-optimization wheels
              run: |
                  pip download mozjpeg-lossless-optimization --dest ./wheels --only-binary=:all: --python-version=3.11 --platform win_amd64 || true
                  pip download mozjpeg-lossless-optimization --dest ./wheels --only-binary=:all: --python-version=3.11 --platform manylinux2014_x86_64 || true
                  pip download mozjpeg-lossless-optimization --dest ./wheels --only-binary=:all: --python-version=3.11 --platform macosx_10_9_x86_64 || true

            - name: Inject Google credentials
              run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

            - name: Package addon zip
              run: |
                  TAG="${GITHUB_REF#refs/tags/v}"
                  ZIP_NAME="OptiFlow-v${TAG}.zip"
                  zip -r "$ZIP_NAME" . \
                    -x ".git/*" \
                    -x ".github/*" \
                    -x ".gitignore" \
                    -x ".claude/*" \
                    -x "*.blend" \
                    -x "*.blend1" \
                    -x "*.blend2" \
                    -x "__pycache__/*" \
                    -x "*/__pycache__/*" \
                    -x ".vscode/*" \
                    -x ".idea/*"
                  echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

            - name: Generate changelog
              run: |
                  CURRENT_TAG="${GITHUB_REF#refs/tags/}"
                  PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)

                  if [ -n "$PREV_TAG" ]; then
                    RANGE="${PREV_TAG}..HEAD"
                    HEADER="## What's Changed since ${PREV_TAG}"
                  else
                    RANGE="HEAD"
                    HEADER="## Changelog"
                  fi

                  {
                    echo "$HEADER"
                    echo ""
                    git log "$RANGE" --pretty=format:"%s" --no-merges | awk 'NF {print "- " $0}'
                    echo ""
                    echo ""
                    echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${CURRENT_TAG}"
                  } > release_notes.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ env.ZIP_NAME }}
                  body_path: release_notes.md
