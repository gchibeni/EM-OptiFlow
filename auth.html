<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EM-OptiFlow — Google Auth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: #fff;
        }

        body.success { --bg: #1a7a3c; }
        body.failure { --bg: #a02020; }

        .card {
            text-align: center;
            padding: 2.5rem 3rem;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            margin-top: 0.75rem;
            font-size: 1rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
    </div>
    <script>
        const ok = typeof AUTH_SUCCESS !== 'undefined' ? AUTH_SUCCESS : false;
        document.body.classList.add(ok ? 'success' : 'failure');
        document.getElementById('title').textContent    = ok ? 'Authenticated!'        : 'Failed';
        document.getElementById('subtitle').textContent = ok ? 'You can close this window and get back to Blender.'
                                                              : 'Close this window and try again.';
    </script>
</body>
</html>
